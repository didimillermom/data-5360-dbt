version: 2

models:
  - name: oliver_dim_customer
    description: "Oliver's Customer Dimension"
    columns:
      - name: customer_key
        tests:
          - unique

  - name: oliver_dim_date
    description: "Oliver's Date Dimension"

  - name: oliver_dim_employee
    description: "Oliver's Employee Dimension"

  - name: oliver_dim_product
    description: "Oliver's Product Dimension"

  - name: oliver_dim_store
    description: "Oliver's Store Dimension"

  - name: fact_sales
    description: "Oliver's Sales Fact Table"
    columns:
      - name: customer_key
        tests:
          - not_null

  
  - name: stg_employee_certifications
    description: |
      Staging model for employee certifications.
      Parses certification details from JSON into
      separate fields for name, cost, and awarded date.
    columns:
      - name: certification_name
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Cash Handling and Security"
                  - "Conflict Resolution"
                  - "Customer Service Excellence"
                  - "Inventory Management"
                  - "Leadership and Coaching"
                  - "Point of Sale Operations"
                  - "Product Knowledge Level 2"
                  - "Strategic Retail Operations"
                  - "Workplace Safety"

  - name: fact_certification
    description: |
      Employee Certification Fact.
      The grain is one row per employee certification completion.
      Contains employee and date dimension keys,
      certification name, and certification cost.
    columns:
      - name: employee_key
        tests:
          - relationships:
              arguments:
                to: ref('oliver_dim_employee')
                field: employee_key  